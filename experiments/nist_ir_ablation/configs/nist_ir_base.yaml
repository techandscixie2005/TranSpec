data:
  input: null
  processed_dir: null
  split_seed: 1234
  train_ratio: 0.8
  valid_ratio: 0.1
  test_ratio: 0.1

spectrum:
  target_len: 3000
  x_min: 552.0
  x_max: 3844.0
  clip_negative: true
  normalize: max
  filter_all_zero: false

fourier:
  num_frequencies: 32

model:
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.2
  max_len: 256
  use_cnn: true
  use_mlp: false

training:
  epochs: 300
  batch_size: 32
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.0001
  betas: [0.9, 0.99]
  label_smoothing: 0.05
  grad_clip: 1.0
  amp: true
  num_workers: 4
  early_stopping_patience: 30

scheduler:
  type: reduce_on_plateau
  interval: epoch
  factor: 0.5
  patience: 5

decoding:
  threshold_value: 0.01
  candidate_limit: 500
  max_len: 256

tokenizer:
  max_len: 256

spe:
  vocab_size: 100
  min_frequency: 2
